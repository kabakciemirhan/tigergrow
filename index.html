<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f8f8">
<title>TIGER GROW</title>
<style>
:root{
  --bg:#f8f8f8; --ink:#26281d; --accent:#cfc9ac; --accent-2:#bdb692;
  --tiger:#E8960C; --tiger-d:#B86E00; --stripe:#7A3C8A; --brand:#8E4A9E; --brand-d:#6B3480; --gold:#FBB31B;
  --card:#ffffff; --muted:#6d6f62; --line:rgba(38,40,29,.12);
  --ok:#3f8f5a; --warn:#b3261e;
  --shadow:0 .5rem 1.6rem rgba(38,40,29,.14);
  --font:Helvetica,"Helvetica Neue",Arial,sans-serif;
  --tw:9.4rem;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{font-size:clamp(10px,calc(100vw / 120),22px)}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea{font-family:inherit;color:var(--ink);user-select:text;-webkit-user-select:text}

/* ---------- HABITAT ---------- */
#habitat{position:fixed;inset:0;overflow:hidden;background:#cfe6ee}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
#tigerLayer,#labelLayer,#fxLayer{position:absolute;inset:0;pointer-events:none}
#tigerLayer{z-index:1;isolation:isolate}#nightTint{z-index:2}#labelLayer{z-index:3}#fxLayer{z-index:4}
.crowd .tg-label{font-size:.92rem;padding:.15rem .55rem}.crowd .tg-pts{font-size:.9rem}
#nightTint{position:absolute;inset:0;background:rgba(14,22,52,.22);opacity:0;transition:opacity 1.2s;pointer-events:none}
#nightTint{display:none}
.tiger{position:absolute;left:0;top:0;width:var(--tw);height:var(--tw);transform-origin:50% 100%;pointer-events:auto;will-change:transform;cursor:pointer}
.tg-bob{position:absolute;inset:0;transform-origin:50% 95%}
.tg-flip{width:100%;height:100%;transition:transform .25s}
.tg-svg{width:100%;height:100%;display:block;overflow:visible}
.tg-body{transform-box:view-box;transform-origin:70px 130px}
.tg-glow{position:absolute;left:-8%;top:0;width:116%;height:100%;border-radius:50%;background:radial-gradient(circle at 50% 52%,rgba(243,227,250,.95),rgba(181,124,196,.42) 45%,rgba(181,124,196,0) 68%);will-change:transform,opacity;animation:pulse 2.4s ease-in-out infinite alternate}
.tiger .tg-aura{display:none}
@keyframes bob{from{transform:translateY(0) rotate(-2.5deg)}to{transform:translateY(-4px) rotate(2.5deg)}}
@keyframes breathe{from{transform:scale(1,1)}to{transform:scale(1.02,.985)}}
.tiger.idle .tg-bob{animation:bob 2.8s ease-in-out infinite alternate}
.tiger.idle .tg-body{animation:breathe 3.4s ease-in-out infinite alternate}
.tg-tail{transform-box:view-box;transform-origin:98px 108px}
.wag .tg-tail{animation:wag 1.5s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-9deg)}to{transform:rotate(11deg)}}
.tiger.happy .tg-bob,.hopper .tg-body{animation:hop .46s ease-out 3}
@keyframes hop{0%,100%{transform:translateY(0) scale(1)}45%{transform:translateY(-24px) scale(1.05,.95)}}
.tg-aura{transform-box:view-box;transform-origin:70px 74px}
.wag .tg-aura{animation:pulse 2.4s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.5;transform:scale(.92)}to{opacity:1;transform:scale(1.05)}}
.tg-spark{transform-box:fill-box;transform-origin:center}
.wag .tg-spark{animation:twinkle 1.6s ease-in-out infinite alternate}
.tg-label{position:absolute;left:0;top:0;white-space:nowrap;padding:.25rem .8rem .3rem;border-radius:1.1rem;background:rgba(255,255,255,.94);box-shadow:0 .15rem .5rem rgba(0,0,0,.14);font-weight:700;font-size:1.1rem;display:flex;flex-direction:column;align-items:center;line-height:1.15;will-change:transform;pointer-events:auto;cursor:pointer}
.tg-row{display:flex;align-items:center;gap:.35rem}
.tg-pts{font-weight:800;font-size:1.05rem;color:var(--brand-d)}
.hide-pts .tg-pts{display:none}
.tg-stars{color:var(--tiger);font-size:.85rem;letter-spacing:-.08em}
.hide-stars .tg-stars{display:none}

/* scene animation */
#sceneFx{position:absolute;inset:0;pointer-events:none}
.fxb,.fxd{position:absolute;display:block;pointer-events:none;overflow:visible}
.cloud{animation:drift 150s linear infinite;will-change:transform}
.cloud.c2{animation-duration:200s;animation-delay:-70s}
.cloud.c3{animation-duration:175s;animation-delay:-125s}
.fxd.tw{border-radius:50%;background:radial-gradient(circle,#fff 0 30%,rgba(255,255,255,0) 70%);animation:twinkle 2.6s ease-in-out infinite alternate;will-change:opacity}
.fxd.ff{border-radius:50%;background:radial-gradient(circle,#FFF9B0 0 25%,rgba(255,249,176,0) 70%);animation:fly 7s ease-in-out infinite alternate;will-change:transform,opacity}
@keyframes drift{from{transform:translateX(-20vw)}to{transform:translateX(120vw)}}
.water{stroke-dasharray:28 22;animation:flow .9s linear infinite}
@keyframes flow{to{stroke-dashoffset:-50}}
.star{animation:twinkle 2.4s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.25}to{opacity:1}}
.firefly{animation:fly 6s ease-in-out infinite alternate}
@keyframes fly{0%{transform:translate(0,0);opacity:.2}50%{opacity:1}100%{transform:translate(40px,-30px);opacity:.3}}
.bfly{animation:bpath 18s ease-in-out infinite}
.bfly .wing{transform-box:fill-box;transform-origin:right center;animation:flap .22s ease-in-out infinite alternate}
.bfly .wing.r{transform-origin:left center}
@keyframes flap{from{transform:scaleX(1)}to{transform:scaleX(.25)}}
@keyframes bpath{0%{transform:translate(0,0)}25%{transform:translate(160px,-70px)}50%{transform:translate(60px,-150px)}75%{transform:translate(-120px,-60px)}100%{transform:translate(0,0)}}
#habitat .night-only{opacity:0;transition:opacity 1.2s}
#habitat.night .night-only{opacity:1}
#habitat .day-only{transition:opacity 1.2s}
#habitat.night .day-only{opacity:0}
#habitat.night #sceneFx .day-only,#habitat:not(.night) #sceneFx .night-only{display:none}
.rw{display:none}
#habitat.r-flowers .rw-flowers,#habitat.r-tree .rw-tree,#habitat.r-waterfall .rw-waterfall,
#habitat.r-butterflies .rw-butterflies,#habitat.r-rainbow .rw-rainbow{display:inline}
#habitat.r-waterfall .fxb.rw-waterfall,#habitat.r-butterflies .fxb.rw-butterflies{display:block}

/* fx */
.fx-float{position:absolute;left:0;top:0;font-weight:800;font-size:2rem;color:var(--ink);background:#fff;border-radius:2rem;padding:.2rem .9rem;box-shadow:var(--shadow);animation:floatUp 1.6s ease-out forwards;white-space:nowrap}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,0) scale(.6)}15%{opacity:1;transform:translate(-50%,-20px) scale(1.08)}100%{opacity:0;transform:translate(-50%,-120px) scale(1)}}
.fx-heart{position:absolute;left:0;top:0;font-size:1.8rem;animation:heart 1.4s ease-out forwards}
@keyframes heart{0%{opacity:0;transform:translate(0,0) scale(.4)}20%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-110px) scale(1.1)}}
.bubble{position:absolute;left:0;top:0;transform:translate(-50%,-100%);background:#fff;border-radius:1.2rem;box-shadow:var(--shadow);padding:1rem 1.2rem;min-width:16rem;pointer-events:none;animation:pop .25s ease-out}
.bubble::after{content:"";position:absolute;left:50%;bottom:-.7rem;margin-left:-.7rem;border:.7rem solid transparent;border-bottom:0;border-top-color:#fff}
.bubble b{font-size:1.4rem}
.bubble .lv{color:var(--muted);font-weight:600;margin:.2rem 0 .6rem}
@keyframes pop{from{opacity:0;transform:translate(-50%,-90%) scale(.9)}to{opacity:1;transform:translate(-50%,-100%) scale(1)}}

/* ---------- TOP BAR / DOCK ---------- */
#topbar{position:fixed;top:1.2rem;left:1.2rem;right:1.2rem;display:flex;align-items:center;gap:1rem;pointer-events:none;z-index:20}
#topbar>*{pointer-events:auto}
.glass{background:rgba(248,248,248,.93);border:1px solid rgba(255,255,255,.75);box-shadow:var(--shadow);border-radius:1.4rem}
.brand{display:flex;align-items:center;gap:.8rem;padding:.5rem .6rem .5rem .5rem;height:5.2rem}
.logo{width:4.2rem;height:4.2rem;border-radius:50%;background:#fff;overflow:hidden;display:grid;place-items:center;border:2px solid var(--accent)}
.logo img{width:100%;height:100%;object-fit:contain}
.logo svg{width:118%;height:118%;margin-top:12%}
.brand-title{font-weight:800;letter-spacing:.05em;font-size:1.35rem;line-height:1}
.brand-title small{display:block;font-size:.8rem;letter-spacing:.02em;color:var(--muted);font-weight:600;margin-top:.25rem}
.class-btn{min-height:4rem;padding:0 1.3rem;border-radius:1rem;background:var(--brand);color:#fff;font-weight:700;font-size:1.25rem;display:flex;align-items:center;gap:.5rem}
.goal{flex:1;display:flex;align-items:center;gap:1.2rem;padding:.6rem 1.4rem;height:5.2rem;min-width:0}
.goal-text{display:flex;flex-direction:column;gap:.15rem;white-space:nowrap}
.goal-label{font-size:.95rem;color:var(--muted);font-weight:600}
.goal-title{font-size:1.2rem;font-weight:800}
.goal-bar{flex:1;height:1.7rem;border-radius:1rem;background:#e8e5d8;overflow:hidden;position:relative;min-width:8rem}
.goal-fill{height:100%;width:0;border-radius:1rem;background:linear-gradient(90deg,#FFD45C,#FBB31B 60%,#F29E0C);transition:width .9s cubic-bezier(.2,.8,.2,1);position:relative;overflow:hidden}
.goal-fill::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 1.3rem,rgba(122,60,138,.38) 1.3rem 1.8rem);animation:stripes 3s linear infinite;background-size:200% 100%}
@keyframes stripes{to{background-position:-6.2rem 0}}
.goal.done .goal-fill{background:linear-gradient(90deg,#7fbd5a,#3f8f5a)}
.goal-num{font-weight:800;font-size:1.45rem;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:.4rem;padding:.45rem .95rem;border-radius:2rem;background:var(--accent);font-weight:700;font-size:1rem;white-space:nowrap}
.tools{display:flex;gap:.6rem;padding:.6rem;height:5.2rem;align-items:center}
.icon-btn{width:4rem;height:4rem;border-radius:1rem;display:grid;place-items:center;font-size:1.6rem;background:#fff;border:1px solid var(--line)}
.icon-btn.on{background:var(--ink);color:#fff}
#dock{position:fixed;right:1.6rem;bottom:1.6rem;display:flex;gap:1rem;z-index:20}
.dock-btn{height:5.2rem;padding:0 2rem;border-radius:2.6rem;font-size:1.35rem;font-weight:800;display:flex;align-items:center;gap:.7rem}
.dock-btn.primary{background:var(--brand);color:#fff;box-shadow:var(--shadow)}
.dock-btn .em{font-size:1.8rem}

/* ---------- BUTTONS / FORMS ---------- */
.btn{min-height:4rem;padding:0 1.4rem;border-radius:1rem;font-size:1.15rem;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;background:#fff;border:1px solid var(--line);transition:transform .12s,background .2s,opacity .2s;white-space:nowrap}
.btn:active,.icon-btn:active,.dock-btn:active,.class-btn:active{transform:scale(.96)}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.tiger{background:var(--tiger);color:#fff;border-color:var(--tiger)}
.btn.brand{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.soft{background:var(--accent);border-color:transparent}
.btn.danger{color:var(--warn)}
.btn.block{width:100%}
.btn[disabled],.icon-btn[disabled]{opacity:.35;pointer-events:none}
.field{display:flex;flex-direction:column;gap:.5rem;margin-bottom:1.2rem}
.field label{font-weight:700;font-size:1.05rem}
.input,.textarea{width:100%;min-height:4rem;border-radius:1rem;border:1px solid var(--line);background:#fff;padding:.8rem 1rem;font-size:1.2rem;outline:none}
.textarea{min-height:12rem;resize:vertical;line-height:1.45}
.input:focus,.textarea:focus{border-color:var(--tiger);box-shadow:0 0 0 .25rem rgba(242,138,46,.18)}
.hint{color:var(--muted);font-size:1rem;line-height:1.45}
.row{display:flex;gap:.8rem;align-items:center;flex-wrap:wrap}
.check{display:flex;align-items:center;gap:.8rem;min-height:4rem;font-size:1.1rem;font-weight:600;cursor:pointer}
.check input{width:1.8rem;height:1.8rem;accent-color:var(--tiger)}
.toggle{position:relative;width:4.6rem;height:2.7rem;border-radius:2rem;background:#d9d6c8;transition:background .2s;flex:none}
.toggle::after{content:"";position:absolute;top:.25rem;left:.25rem;width:2.2rem;height:2.2rem;border-radius:50%;background:#fff;box-shadow:0 .1rem .3rem rgba(0,0,0,.2);transition:transform .2s}
.toggle.on{background:var(--ok)}
.toggle.on::after{transform:translateX(1.9rem)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:1rem;min-height:4.6rem;padding:.4rem 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row .t{font-weight:700;font-size:1.15rem}
.set-row .d{color:var(--muted);font-size:.95rem;margin-top:.2rem}

/* ---------- PANEL ---------- */
#panel{position:fixed;top:0;right:0;bottom:0;width:min(78rem,100vw);background:var(--bg);box-shadow:-1rem 0 3rem rgba(38,40,29,.25);display:flex;flex-direction:column;transform:translateX(105%);transition:transform .38s cubic-bezier(.2,.8,.2,1);z-index:40}
#panel.open{transform:none}
.p-head{display:flex;align-items:center;gap:1rem;padding:1.2rem 1.6rem;border-bottom:1px solid var(--line);background:#fff}
.p-title{font-weight:800;font-size:1.5rem;white-space:nowrap}
.p-title small{display:block;color:var(--muted);font-size:.95rem;font-weight:600}
.seg{display:flex;background:#ecebe4;border-radius:1.1rem;padding:.3rem;gap:.2rem;margin:0 auto}
.seg button{min-height:4rem;padding:0 1.3rem;border-radius:.85rem;font-weight:700;font-size:1.1rem;color:var(--muted);white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 .15rem .5rem rgba(0,0,0,.1)}
.p-body{flex:1;overflow:auto;padding:1.4rem 1.6rem;-webkit-overflow-scrolling:touch}
.p-foot{border-top:1px solid var(--line);background:#fff;padding:1rem 1.6rem 1.2rem}
.toolbar{display:flex;gap:.8rem;align-items:center;margin-bottom:1.2rem;flex-wrap:wrap}
.toolbar .sp{flex:1}
.sel-count{font-weight:700;color:var(--muted);font-size:1.1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(10.6rem,1fr));gap:.9rem}
.scard{position:relative;background:#fff;border:2px solid transparent;border-radius:1.2rem;padding:.5rem .5rem .8rem;display:flex;flex-direction:column;align-items:center;box-shadow:0 .2rem .8rem rgba(38,40,29,.07);transition:border-color .15s,transform .12s,background .15s;min-height:12rem}
.scard:active{transform:scale(.97)}
.scard.sel{border-color:var(--brand);background:#f8f0fa}
.scard .mini{width:6.6rem;height:6.6rem}
.scard .nm{font-weight:800;font-size:1.2rem;margin-top:.1rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scard .st{color:var(--tiger);font-size:.95rem;letter-spacing:-.06em}
.scard .ck{position:absolute;top:.5rem;left:.5rem;width:2.2rem;height:2.2rem;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:1.1rem;font-weight:900;color:#fff;background:#fff}
.scard.sel .ck{background:var(--brand);border-color:var(--brand)}
.scard .pt{color:var(--muted);font-weight:800;letter-spacing:0;margin-left:.3rem}
.scard .info{position:absolute;top:.25rem;right:.25rem;width:4rem;height:4rem;border-radius:50%;display:grid;place-items:center;font-size:1.3rem;color:var(--muted);font-weight:800}
.scard .dot{position:absolute;top:1rem;right:3.6rem;width:.8rem;height:.8rem;border-radius:50%;background:var(--accent-2)}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}
.cat{background:var(--bg);border-radius:1.1rem;padding:.7rem}
.cat-h{font-weight:800;font-size:1.15rem;margin:.1rem .2rem .6rem;display:flex;align-items:center;gap:.4rem;white-space:nowrap}
.cat-h .e{font-size:1.5rem}
.cat-b{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.feed{min-height:4.6rem;border-radius:.9rem;background:#fff;border:1px solid var(--line);font-weight:800;font-size:1.05rem;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;transition:transform .1s,background .15s}
.feed b{font-size:1.45rem;color:var(--tiger-d)}
.feed:active{transform:scale(.94);background:#fff2e4}
.feed[disabled]{opacity:.35;pointer-events:none}
.foot-hint{text-align:center;color:var(--muted);font-weight:600;margin-bottom:.7rem;font-size:1rem;min-height:1.3rem}
.remind{background:#fff;border:1px dashed var(--accent-2);border-radius:1.1rem;padding:1rem 1.2rem;margin-bottom:1.2rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.remind .t{font-weight:700}
.remind .names{color:var(--muted);flex:1;min-width:12rem}
.bell{position:relative}
.bell .badge{position:absolute;top:-.3rem;right:-.3rem;min-width:1.6rem;height:1.6rem;border-radius:1rem;background:var(--accent-2);color:var(--ink);font-size:.85rem;font-weight:800;display:grid;place-items:center;padding:0 .3rem}
.card{background:#fff;border-radius:1.3rem;padding:1.4rem 1.6rem;box-shadow:0 .2rem .8rem rgba(38,40,29,.06);margin-bottom:1.2rem}
.card h3{margin:0 0 1rem;font-size:1.3rem}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem}
.list-row{display:flex;align-items:center;gap:.8rem;padding:.5rem 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}
.list-row .mini{width:3.6rem;height:3.6rem;flex:none}
.list-row .nm{flex:1;font-weight:700;font-size:1.15rem}
table.rep{width:100%;border-collapse:separate;border-spacing:0;font-size:1.1rem}
table.rep th{text-align:left;color:var(--muted);font-weight:700;padding:.7rem .6rem;border-bottom:1px solid var(--line);font-size:1rem}
table.rep td{padding:.6rem;border-bottom:1px solid var(--line);vertical-align:middle}
table.rep td .pair{display:flex;align-items:center;gap:.6rem}
table.rep td .self{font-size:1.8rem}
table.rep td .tch{font-weight:800;background:var(--bg);border-radius:.6rem;padding:.2rem .6rem;min-width:3rem;text-align:center}
.talk{font-size:.95rem;color:var(--muted);font-weight:600}
.weeknav{display:flex;align-items:center;gap:.8rem;margin-bottom:1rem}
.weeknav .w{font-weight:800;font-size:1.25rem;min-width:14rem;text-align:center}
.stepper{display:flex;align-items:center;gap:.6rem}
.stepper .v{font-weight:800;font-size:1.5rem;min-width:4rem;text-align:center;font-variant-numeric:tabular-nums}
.rw-list{display:flex;gap:.6rem;flex-wrap:wrap}
.rw-item{padding:.5rem .9rem;border-radius:2rem;background:var(--bg);font-weight:700;color:var(--muted)}
.rw-item.on{background:var(--accent);color:var(--ink)}

/* ---------- MODAL ---------- */
#modalRoot{position:fixed;inset:0;z-index:60;pointer-events:none}
.modal-wrap{position:absolute;inset:0;background:rgba(38,40,29,.42);display:grid;place-items:center;pointer-events:auto;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--bg);border-radius:1.8rem;box-shadow:0 2rem 5rem rgba(0,0,0,.3);width:min(44rem,94vw);max-height:92vh;display:flex;flex-direction:column;animation:rise .28s cubic-bezier(.2,.8,.2,1)}
.modal.wide{width:min(66rem,96vw)}
@keyframes rise{from{transform:translateY(2rem) scale(.98);opacity:0}}
.m-head{display:flex;align-items:center;gap:1rem;padding:1.4rem 1.6rem 1rem}
.m-head h2{margin:0;font-size:1.6rem;flex:1}
.m-body{padding:0 1.6rem 1rem;overflow:auto}
.m-foot{display:flex;gap:.8rem;justify-content:flex-end;padding:1rem 1.6rem 1.4rem;flex-wrap:wrap}
.pin-dots{display:flex;gap:1rem;justify-content:center;margin:1rem 0 1.4rem}
.pin-dots i{width:1.4rem;height:1.4rem;border-radius:50%;border:2px solid var(--ink)}
.pin-dots i.f{background:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,6rem);gap:.8rem;justify-content:center}
.pad button{height:6rem;border-radius:50%;background:#fff;font-size:2rem;font-weight:700;border:1px solid var(--line)}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-.6rem)}40%,80%{transform:translateX(.6rem)}}
.class-list{display:flex;flex-direction:column;gap:.7rem}
.class-item{min-height:4.6rem;border-radius:1.1rem;background:#fff;border:2px solid transparent;display:flex;align-items:center;justify-content:space-between;padding:0 1.3rem;font-weight:800;font-size:1.3rem}
.class-item.on{border-color:var(--tiger)}
.class-item span{color:var(--muted);font-weight:600;font-size:1rem}
.welcome-hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:.4rem 0 .6rem}
.welcome-hero .tigers{display:flex;align-items:flex-end;gap:.2rem;height:9rem}
.welcome-hero .tigers svg{height:9rem;width:9rem}
.welcome-hero p{color:var(--muted);font-size:1.15rem;line-height:1.5;margin:.6rem 0 0;max-width:34rem}
.bigchoice{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:1rem;margin-top:1.2rem}
.bigchoice button{min-height:8rem;border-radius:1.3rem;background:#fff;border:2px solid var(--line);font-weight:800;font-size:1.3rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4rem;padding:1rem}
.bigchoice button small{font-weight:600;color:var(--muted);font-size:.95rem}
.bigchoice button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.bigchoice button.primary small{color:#d8d6cb}
.detail-top{display:flex;gap:1.4rem;align-items:center}
.detail-top .big{width:11rem;height:11rem;flex:none}
.lvl-name{font-size:1.25rem;font-weight:700;color:var(--muted)}
.pbar{height:1.2rem;border-radius:1rem;background:#e8e5d8;overflow:hidden;margin:.6rem 0 .3rem}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#FBB31B,#8E4A9E);border-radius:1rem}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:.7rem;margin-top:1rem}
.kv div{background:#fff;border-radius:1rem;padding:.8rem;text-align:center}
.kv b{display:block;font-size:1.6rem}
.kv span{color:var(--muted);font-size:.95rem;font-weight:600}

/* ---------- KAPLAN KARTI / SÜSLEME ---------- */
.sheet-top{display:flex;gap:1.8rem;align-items:center}
.sheet-top .big{width:15rem;height:15rem;flex:none}
.sh-name{font-size:2.4rem;font-weight:800}
.pts-big{font-size:2.2rem;font-weight:800;color:var(--brand-d);margin-top:.4rem}
.pts-big span{font-size:1.1rem;color:var(--muted)}
.sh-feed{margin-top:1.4rem;background:#fff;border-radius:1.3rem;padding:1.2rem}
.sh-h{font-weight:800;font-size:1.35rem;margin-bottom:.8rem;display:flex;align-items:center;gap:1rem;justify-content:space-between}
.sh-feed .cat{background:var(--bg)}
.lock-note{background:var(--bg);border-radius:1rem;padding:1.4rem;font-size:1.3rem;font-weight:700;text-align:center}
.deco-wrap{display:grid;grid-template-columns:19rem 1fr;gap:1.6rem;align-items:start}
.deco-prev{width:19rem;height:19rem;border-radius:1.6rem;background:radial-gradient(circle at 50% 60%,#fff,#efe6f2)}
.slot-h{font-weight:800;font-size:1.15rem;margin:.8rem 0 .5rem}
.slot-h:first-child{margin-top:0}
.deco-row{display:flex;gap:.6rem;flex-wrap:wrap}
.deco-opt{width:10rem;height:11.4rem;border-radius:1rem;background:#fff;border:3px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:.88rem;position:relative;box-shadow:0 .15rem .5rem rgba(38,40,29,.07);text-align:center;line-height:1.1;padding:.2rem}
.deco-opt svg{width:8rem;height:8rem;flex:none}
.deco-opt .none{width:8rem;height:8rem;display:grid;place-items:center;font-size:2.6rem;color:#c9c5b5}
.deco-opt.on{border-color:var(--brand);background:#f8f0fa}
.deco-opt.lock{opacity:.45}
.deco-opt .lk{position:absolute;top:.3rem;right:.4rem;font-size:.75rem;font-weight:800}
.modal .m-foot .btn.brand{min-width:10rem}
.modal.wide:has(.deco-wrap){width:min(86rem,97vw)}
.deco-wrap>div:first-child{position:sticky;top:0}

/* ---------- SELF ASSESSMENT ---------- */
#selfView{position:fixed;inset:0;z-index:45;background:var(--bg);display:none;flex-direction:column}
#selfView.open{display:flex;animation:fade .3s}
.sv-head{display:flex;align-items:center;gap:1rem;padding:1.4rem 2rem;background:#fff;border-bottom:1px solid var(--line)}
.sv-head h1{margin:0;font-size:1.9rem;flex:1}
.sv-head h1 small{display:block;font-size:1.05rem;color:var(--muted);font-weight:600;margin-top:.2rem}
.sv-body{flex:1;overflow:auto;padding:2rem}
.sv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(13rem,1fr));gap:1.2rem}
.sv-card{background:#fff;border-radius:1.4rem;padding:.8rem .8rem 1.1rem;display:flex;flex-direction:column;align-items:center;box-shadow:0 .2rem .8rem rgba(38,40,29,.07);position:relative;min-height:14rem}
.sv-card .mini{width:8.6rem;height:8.6rem}
.sv-card .nm{font-size:1.45rem;font-weight:800}
.sv-card .done{position:absolute;top:.7rem;right:.7rem;background:var(--ok);color:#fff;border-radius:2rem;font-weight:800;font-size:.9rem;padding:.3rem .7rem}
.sv-q{max-width:72rem;margin:0 auto;display:flex;flex-direction:column;align-items:center;text-align:center}
.sv-q .big{width:15rem;height:15rem}
.sv-q .hello{font-size:1.6rem;font-weight:700;color:var(--muted);margin:.4rem 0 0}
.sv-q .qnum{margin-top:1.6rem;font-weight:800;color:var(--tiger-d);font-size:1.2rem;letter-spacing:.05em}
.sv-q .qtext{font-size:3rem;font-weight:800;margin:.6rem 0 2.2rem;line-height:1.2}
.scale{display:flex;gap:1.2rem;justify-content:center;flex-wrap:wrap}
.scale button{width:10.5rem;height:11rem;border-radius:1.6rem;background:#fff;border:3px solid transparent;box-shadow:0 .3rem 1rem rgba(38,40,29,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;font-weight:800;font-size:1.15rem;transition:transform .12s,border-color .15s}
.scale button .e{font-size:4.4rem;line-height:1}
.scale button:active{transform:scale(.94);border-color:var(--tiger)}
.qdots{display:flex;gap:.6rem;margin-top:2rem}
.qdots i{width:1rem;height:1rem;border-radius:50%;background:#dcd9cc}
.qdots i.on{background:var(--tiger)}
.thanks{font-size:2.8rem;font-weight:800;margin-top:1rem}

/* ---------- CELEBRATION ---------- */
#celebrate{position:fixed;inset:0;z-index:80;display:none;place-items:center;background:radial-gradient(circle at 50% 45%,rgba(255,226,150,.94),rgba(251,179,27,.88) 42%,rgba(107,52,128,.94) 100%);cursor:pointer;overflow:hidden}
#celebrate.open{display:grid;animation:fade .3s}
.cel-rays{position:absolute;left:50%;top:45%;width:180vmax;height:180vmax;margin:-90vmax 0 0 -90vmax;background:repeating-conic-gradient(rgba(255,255,255,.18) 0 8deg,transparent 8deg 20deg);animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cel-card{position:relative;text-align:center;color:#fff;text-shadow:0 .2rem .8rem rgba(0,0,0,.25)}
.cel-tiger{width:26rem;height:26rem;margin:0 auto;animation:grow 1.2s cubic-bezier(.2,1.6,.4,1)}
@keyframes grow{0%{transform:scale(.4) translateY(4rem);opacity:0}100%{transform:scale(1);opacity:1}}
.cel-card h2{font-size:3.6rem;margin:.4rem 0 .4rem}
.cel-card p{font-size:1.8rem;margin:0;font-weight:700}
.cel-card .reward-icon{font-size:12rem;line-height:1;animation:grow 1s cubic-bezier(.2,1.6,.4,1)}
.cel-hint{position:absolute;bottom:2rem;left:0;right:0;text-align:center;color:rgba(255,255,255,.75);font-weight:700;font-size:1.1rem}
.confetti{position:absolute;top:-3rem;width:1rem;height:1.6rem;border-radius:.2rem;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot))}}

/* ---------- TOAST ---------- */
#toasts{position:fixed;left:1.6rem;bottom:1.6rem;display:flex;flex-direction:column;gap:.6rem;align-items:flex-start;max-width:min(40rem,calc(100vw - 3.2rem));z-index:90;pointer-events:none}
.toast{background:var(--ink);color:#fff;border-radius:1.4rem;padding:.6rem .7rem .6rem 1.4rem;font-weight:700;font-size:1.15rem;display:flex;align-items:center;gap:1rem;box-shadow:var(--shadow);pointer-events:auto;animation:rise .25s;min-height:4.4rem}
.toast.warn{background:var(--warn)}
.toast button{min-height:4rem;padding:0 1rem;border-radius:.9rem;background:rgba(255,255,255,.16);color:#fff;font-weight:800;font-size:1.05rem}
.toast:not(:has(button)){padding-right:1.4rem}

/* ---------- KIYAFET SEKMELERİ / CİNSİYET ---------- */
.slot-tabs{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}
.slot-tabs button{min-height:4.4rem;padding:0 1.1rem;border-radius:1rem;background:#fff;border:2px solid var(--line);font-weight:800;font-size:1.1rem;display:flex;align-items:center;gap:.45rem}
.slot-tabs button .e{font-size:1.5rem}
.slot-tabs button.on{border-color:var(--brand);background:#f8f0fa;color:var(--brand-d)}
.slot-tabs button small{font-weight:700;color:var(--muted);font-size:.85rem}
.gchip{display:inline-grid;place-items:center;min-width:2.2rem;height:2.2rem;padding:0 .4rem;border-radius:1rem;font-size:.9rem;font-weight:800;background:var(--bg);color:var(--muted);flex:none}
.gchip.K{background:#fbe3ee;color:#a83d6c}.gchip.E{background:#e1ecf8;color:#2f5f93}
.deco-opt .gtag{position:absolute;top:.3rem;left:.4rem;font-size:.85rem}

/* ---------- EXCEL / ARŞİV ---------- */
.xl-card{border:2px solid #cfe5d4;background:#f5fbf6}
.xl-status{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;margin-bottom:.8rem}
.xl-status .ok{color:var(--ok);font-weight:800}
.xl-status .no{color:var(--warn);font-weight:800}
.arch-row{opacity:.8}
.arch-row .nm{color:var(--muted)}
select.input{appearance:auto;padding:.6rem 1rem}

/* ---------- RAPORLAR ---------- */
.pick-row{display:flex;gap:.6rem;flex-wrap:wrap}
.pick-row button{min-height:4rem;padding:0 1.2rem;border-radius:1rem;background:#fff;border:2px solid var(--line);font-weight:800;font-size:1.1rem}
.pick-row button.on{border-color:var(--brand);background:#f8f0fa;color:var(--brand-d)}
.rep-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem;margin-top:1rem}
.rep-actions .btn{min-height:6rem;flex-direction:column;gap:.2rem;white-space:normal;text-align:center;line-height:1.2}
.rep-actions .btn small{font-weight:600;font-size:.9rem;opacity:.8}
.busy{opacity:.5;pointer-events:none}
.lvl-row{display:flex;align-items:center;justify-content:space-between;gap:1rem;min-height:4.4rem}
.lvl-row .nm{font-weight:800;font-size:1.05rem}
.pace-track{position:relative;height:1.8rem;border-radius:1rem;background:#e8e5d8;margin:.8rem 0 .4rem}
.pace-band{position:absolute;top:0;bottom:0;background:rgba(63,143,90,.28);border-radius:.4rem}
.pace-mark{position:absolute;top:-.25rem;bottom:-.25rem;width:.45rem;border-radius:.3rem;background:var(--brand);transform:translateX(-50%)}
.pace-scale{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;font-weight:700;margin-bottom:.8rem}
.pace-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem;margin-top:.6rem}
.pace-nums div{background:var(--bg);border-radius:1rem;padding:.8rem 1rem}
.pace-nums b{display:block;font-size:1.7rem;font-variant-numeric:tabular-nums}
.pace-nums span{color:var(--muted);font-weight:700;font-size:.95rem}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>

/* viewBox "slice" eşlemesi: sahne birimlerini ekran pikseline çevir */
function layoutSceneFx() {

/* =========================================================
   HABITAT MOTORU (requestAnimationFrame)
   ========================================================= */
const HB = {
  tigers: new Map(), W: 0, H: 0, tw: 150, last: 0, panelOpen: false,
  el: null, layer: null, labels: null, fx: null,
  init() {
    this.el = $('#habitat'); this.layer = $('#tigerLayer'); this.labels = $('#labelLayer'); this.fx = $('#fxLayer');
    this.measure();
    window.addEventListener('resize', () => this.measure());
    const tap = e => { const t = e.target.closest('[data-id]'); if (t) openTigerSheet(t.dataset.id); };
    this.layer.addEventListener('click', tap); this.labels.addEventListener('click', tap);
    requestAnimationFrame(ts => { this.last = ts; this.frame(ts); });
  },
  measure() {
    this.W = window.innerWidth; this.H = window.innerHeight;
    this.tw = parseFloat(getComputedStyle(document.documentElement).fontSize) * 9.4 * (this.crowdF || 1);
    document.documentElement.style.setProperty('--tw', this.tw + 'px');
    this.yMin = this.H * 0.57; this.yMax = this.H * 0.94;
    for (const t of this.tigers.values()) { t.x = Math.min(Math.max(t.x, 40), this.W - 40); t.y = Math.min(Math.max(t.y, this.yMin), this.yMax); this.pickTarget(t); }
  },
  xRange() {
    const panelW = this.panelOpen ? Math.min(78 * parseFloat(getComputedStyle(document.documentElement).fontSize), this.W) : 0;
    return [this.tw * .5, Math.max(this.tw * 1.5, this.W - panelW - this.tw * .5)];
  },
  pickTarget(t, near) {
    const [x0, x1] = this.xRange();
    t.tx = near ? x0 + Math.random() * (x1 - x0) : this.tw * .5 + Math.random() * (this.W - this.tw);
    t.ty = this.yMin + Math.random() * (this.yMax - this.yMin);
    t.state = 'walk'; t.el.classList.add('walking'); t.el.classList.remove('idle');
  },
  setIdle(t, ms) {
    t.state = 'idle'; t.idleUntil = performance.now() + (ms ?? 1500 + Math.random() * 4500);
    t.el.classList.remove('walking'); t.el.classList.add('idle');
  },
  sync(full) {
    const c = cls();
    if (full) { this.tigers.forEach(t => { t.el.remove(); t.lab.remove(); }); this.tigers.clear(); }
    const ids = new Set((c?.students || []).map(s => s.id));
    for (const [id, t] of this.tigers) if (!ids.has(id)) { t.el.remove(); t.lab.remove(); this.tigers.delete(id); }
    (c?.students || []).forEach((s, i) => {
      let t = this.tigers.get(s.id);
      if (!t) {
        const el = document.createElement('div'); el.className = 'tiger idle'; el.dataset.id = s.id;
        el.innerHTML = `<div class="tg-bob"><div class="tg-flip"></div></div>`;
        const lab = document.createElement('div'); lab.className = 'tg-label'; lab.dataset.id = s.id;
        this.layer.appendChild(el); this.labels.appendChild(lab);
        const r = rng(i * 97 + 13);
        t = { id: s.id, el, lab, flip: el.querySelector('.tg-flip'), x: this.tw * .5 + Math.random() * (this.W - this.tw), y: this.yMin + Math.random() * (this.yMax - this.yMin),
              dir: 1, sc: L(s.peak).scale, lvl: 0, tone: -1, name: '', z: -1, speed: 45 + r() * 35 };
        this.tigers.set(s.id, t);
        this.setIdle(t, r() * 2500);
      }
      const vkey = s.peak + '|' + s.tone + '|' + JSON.stringify(decoOf(s));
      if (t.vkey !== vkey) {
        t.flip.innerHTML = tigerOf(s); t.lvl = s.peak; t.tone = s.tone; t.vkey = vkey;
        const g = t.el.querySelector('.tg-glow');
        if (s.peak >= 5 && !g) { const d = document.createElement('div'); d.className = 'tg-glow'; t.el.prepend(d); }
        else if (s.peak < 5 && g) g.remove();
      }
      const nm = s.name + '|' + s.peak + '|' + s.xp;
      if (t.name !== nm) { t.lab.innerHTML = `<span class="tg-row"><span>${esc(s.name)}</span><span class="tg-stars">${stars(s.peak)}</span></span><span class="tg-pts">🍖 ${s.xp}</span>`; t.name = nm; }
    });
    this.el.classList.toggle('hide-stars', !S.settings.showStars);
    this.el.classList.toggle('hide-pts', !S.settings.showPoints);
    const n = c?.students.length || 0, f = Math.min(1, Math.max(.76, 1 - (n - 20) * .01));
    if (f !== this.crowdF) { this.crowdF = f; this.measure(); }
    this.el.classList.toggle('crowd', n > 25);
  },
  frame(ts) {
    const dt = Math.min(0.05, (ts - this.last) / 1000); this.last = ts;
    const span = this.yMax - this.yMin || 1;
    for (const t of this.tigers.values()) {
      if (t.state === 'walk') {
        const dx = t.tx - t.x, dy = t.ty - t.y, d = Math.hypot(dx, dy), step = t.speed * dt;
        if (d <= step) { t.x = t.tx; t.y = t.ty; this.setIdle(t); }
        else {
          t.x += dx / d * step; t.y += dy / d * step;
          const dir = dx < 0 ? -1 : 1;
          if (dir !== t.dir && Math.abs(dx) > 4) { t.dir = dir; t.flip.style.transform = dir < 0 ? 'scaleX(1)' : 'scaleX(-1)'; }
        }
      } else if (ts > t.idleUntil) this.pickTarget(t, this.panelOpen && Math.random() < .3);
      const persp = 0.8 + 0.32 * ((t.y - this.yMin) / span);
      const target = L(t.lvl).scale;
      t.sc += (target - t.sc) * Math.min(1, dt * 2.2);
      const k = t.sc * persp, h = this.tw * k;
      let by = 0;
      if (t.state === 'walk') { t.ph = (t.ph || 0) + dt * 15; by = -Math.abs(Math.sin(t.ph)) * 5 * k; }
      t.el.style.transform = `translate3d(${(t.x - this.tw / 2).toFixed(1)}px,${(t.y - this.tw + by).toFixed(1)}px,0) scale(${k.toFixed(3)})`;
      t.lab.style.transform = `translate3d(${t.x.toFixed(1)}px,${(t.y - h * .05 + by).toFixed(1)}px,0) translate(-50%,0)`;
      const z = t.y | 0;
      if (z !== t.z) { t.el.style.zIndex = z; t.z = z; }
    }
    requestAnimationFrame(x => this.frame(x));
  },
  headPos(t) { const persp = 0.8 + 0.32 * ((t.y - this.yMin) / ((this.yMax - this.yMin) || 1)); return { x: t.x, y: t.y - this.tw * t.sc * persp * .95 }; },
  feedFx(id, cat, amt) {

function tone(notes) {

  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = actx.currentTime;

}

const undoStack = [];
function feed(sids, cat, amt, opt = {}) {
  const c = cls(); if (!c || !sids.length) return;
  if (opt.board) {
    if (!S.settings.boardFeed) return toast('🔒 Besleme şu an kapalı.', { warn:true });
    const s0 = stu(c, sids[0]); if (!s0 || amt > leftToday(s0)) return toast('Kaplan bugün doydu!', { warn:true });
    const tk = todayKey(); s0.day = { d: tk, n: usedToday(s0) + amt };
  }
  const wk = weekKey(), now = Date.now();
  const before = classWeekTotal(c, wk);
  const rec = { classId: c.id, entryId: uid('e'), wk, cat, amt, sids: [...sids], prevFed: {}, board: opt.board ? todayKey() : null };
  const ups = [];
  sids.forEach(id => {
    const s = stu(c, id); if (!s) return;
    rec.prevFed[id] = s.lastFedAt;
    s.xp += amt;
    (s.weeks[wk] = s.weeks[wk] || [0,0,0,0])[cat] += amt;
    s.lastFedAt = now;
    const nl = levelFromXp(s.xp);
    if (nl > s.peak) { s.peak = nl; ups.push(s.id); }
  });
  c.log.unshift({ id: rec.entryId, ts: now, sids: [...sids], cat, amt }); if (c.log.length > 200) c.log.length = 200;
  undoStack.push(rec); if (undoStack.length > 30) undoStack.shift();
  save();
  HB.sync();
  sids.slice(0, 45).forEach((id, i) => setTimeout(() => HB.feedFx(id, cat, amt), Math.min(i * 50, 900)));
  sndFeed();
  const who = sids.length === 1 ? stu(c, sids[0])?.name : `${sids.length} öğrenci`;
  toast(`${CATS[cat].e} ${who}: +${amt} ${CATS[cat].name}`, { action:'↶ Geri Al', onAction: () => undo(rec.entryId) });
  const after = classWeekTotal(c, wk);
  if (before < c.weeklyGoal && after >= c.weeklyGoal && !c.goalWeeks.includes(wk)) {
    c.goalWeeks.push(wk);
    const r = nextReward(c);
    if (r) { c.rewards.push(r.id); if (r.id === 'night') c.nightOn = true; }
    save();
    queueCelebration({ type:'goal', reward: r?.id || null });
  }
  ups.forEach(id => queueCelebration({ type:'level', sid:id }));
  renderTop();
  if (panelState.open) renderPanel();
}
function undo(entryId) {
  const i = entryId ? undoStack.findIndex(x => x.entryId === entryId) : undoStack.length - 1;
  if (i < 0) return toast(entryId ? 'Bu işlem zaten geri alınmış.' : 'Geri alınacak işlem yok.');
  const r = undoStack.splice(i, 1)[0];
  const c = S.classes.find(x => x.id === r.classId); if (!c) return;
  r.sids.forEach(id => {
    const s = stu(c, id); if (!s) return;
    s.xp = Math.max(0, s.xp - r.amt);
    const w = s.weeks[r.wk]; if (w) w[r.cat] = Math.max(0, w[r.cat] - r.amt);
    s.lastFedAt = r.prevFed[id] ?? null;
    if (r.board && s.day && s.day.d === r.board) s.day.n = Math.max(0, s.day.n - r.amt);
    // Kural: kaplan asla küçülmez → peak değişmez
  });
  c.log = c.log.filter(e => e.id !== r.entryId);
  save(); renderTop(); if (panelState.open) renderPanel();

}

/* =========================================================
   EXCEL SINIF LİSTESİ (.xlsx okuyucu, kütüphanesiz)
   Her sayfa bir sınıftır (4A, 5A, 5B). İlk satır başlık: "Ad" ve "Cinsiyet (K/E)".
   Dosya bağlanınca (Chrome/Edge) her açılışta ve dakikada bir değişiklik kontrol edilir.
   ========================================================= */
async function unzip(buf) {
  const u8 = new Uint8Array(buf), dv = new DataView(buf);
  let e = u8.length - 22;
  while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
  if (e < 0) throw new Error('Dosya .xlsx biçiminde değil');
  const n = dv.getUint16(e + 10, true), files = {};
  let p = dv.getUint32(e + 16, true);
  for (let i = 0; i < n && dv.getUint32(p, true) === 0x02014b50; i++) {
    const nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true);
    files[new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nl))] = { method: dv.getUint16(p + 10, true), size: dv.getUint32(p + 20, true), off: dv.getUint32(p + 42, true) };
    p += 46 + nl + xl + cl;
  }
  return async name => {
    const f = files[name]; if (!f) return null;
    const start = f.off + 30 + dv.getUint16(f.off + 26, true) + dv.getUint16(f.off + 28, true);
    const data = u8.subarray(start, start + f.size);
    if (f.method === 0) return new TextDecoder().decode(data);
    return new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
  };
}
async function readXlsx(buf) {
  const read = await unzip(buf), X = t => new DOMParser().parseFromString(t, 'application/xml');
  const tags = (d, t) => [...d.getElementsByTagName(t)];
  const wbTxt = await read('xl/workbook.xml'); if (!wbTxt) throw new Error('Excel çalışma kitabı okunamadı');
  const rels = {}, relTxt = await read('xl/_rels/workbook.xml.rels');
  if (relTxt) tags(X(relTxt), 'Relationship').forEach(r => rels[r.getAttribute('Id')] = r.getAttribute('Target'));
  const ssTxt = await read('xl/sharedStrings.xml');
  const ss = ssTxt ? tags(X(ssTxt), 'si').map(si => tags(si, 't').filter(t => t.parentNode.nodeName !== 'rPh').map(t => t.textContent).join('')) : [];
  const col = ref => { let n = 0; for (const ch of ref.replace(/\d+/g, '')) n = n * 26 + ch.charCodeAt(0) - 64; return n - 1; };
  const out = [];
  for (const sh of tags(X(wbTxt), 'sheet')) {
    let tg = rels[sh.getAttribute('r:id')]; if (!tg) continue;
    tg = tg.startsWith('/') ? tg.slice(1) : 'xl/' + tg.replace(/^\.\//, '');
    const xml = await read(tg); if (!xml) continue;
    const rows = tags(X(xml), 'row').map(r => {
      const row = [];
      tags(r, 'c').forEach(c => {
        const t = c.getAttribute('t'), v = c.getElementsByTagName('v')[0]?.textContent ?? '';
        const val = t === 's' ? (ss[+v] ?? '') : t === 'inlineStr' ? tags(c, 't').map(x => x.textContent).join('') : v;
        const i = col(c.getAttribute('r') || ''); row[i >= 0 ? i : row.length] = String(val).trim();
      });

    });

}
/* Sayfa → { name, students:[{name,g}] }. Başlığında "Ad" sütunu olmayan sayfalar (ör. "Nasıl Kullanılır") atlanır. */
function parseRoster(sheets) {
  const low = v => String(v || '').toLocaleLowerCase('tr').trim();
  return sheets.map(sh => {
    const h = sh.rows.slice(0, 5).findIndex(r => r.some(v => /^(ad|adı|isim|öğrenci adı|öğrenci|name)\b/.test(low(v))));
    if (h < 0) return null;
    const hdr = sh.rows[h], nc = hdr.findIndex(v => /^(ad|adı|isim|öğrenci adı|öğrenci|name)\b/.test(low(v)));
    const gc = hdr.findIndex(v => /cinsiyet|k\s*\/\s*e|gender/.test(low(v)));
    const students = sh.rows.slice(h + 1).map(r => ({ name: String(r[nc] || '').replace(/\s+/g, ' ').trim().slice(0, 24), g: gc >= 0 ? normGender(r[gc]) : '' })).filter(x => x.name);

  }).filter(Boolean);
}
const nameKey = n => String(n).toLocaleLowerCase('tr').replace(/\s+/g, ' ').trim();

function applyRoster(roster) {
  const r = { created: [], added: 0, restored: 0, archived: 0, dup: [], full: [] };
  roster.forEach(sh => {
    let c = S.classes.find(x => !x.isDemo && classKey(x.name) === classKey(sh.name));
    if (!c) { c = Object.assign(blankClass(sh.name), { goalAuto: true }); S.classes.push(c); r.created.push(c.name); }
    c.src = 'excel';
    const act = new Map(c.students.map(s => [nameKey(s.name), s])), arch = new Map(c.archived.map(s => [nameKey(s.name), s]));
    const keep = [], seen = new Set();
    sh.students.forEach(row => {
      const k = nameKey(row.name);
      if (seen.has(k)) return r.dup.push(`${sh.name}: ${row.name}`);
      if (keep.length >= MAX_STUDENTS) return r.full.push(sh.name);
      seen.add(k);
      let s = act.get(k);
      if (!s && arch.has(k)) { s = arch.get(k); delete s.archivedAt; r.restored++; }
      if (!s) { s = newStudent(row.name, row.g, c.students.length + keep.length); r.added++; }
      s.name = row.name; s.g = row.g;
      keep.push(s);
    });
    const now = Date.now();
    c.students.forEach(s => { if (!seen.has(nameKey(s.name))) { s.archivedAt = now; c.archived.push(s); panelState.sel.delete(s.id); r.archived++; } });
    c.archived = c.archived.filter(s => !seen.has(nameKey(s.name)));
    c.students = keep;
    if (c.goalAuto) c.weeklyGoal = Math.max(15, c.students.length * 3);
  });
  if (!cls()) S.activeClassId = S.classes.find(c => c.src === 'excel')?.id || S.classes[0]?.id || null;
  return r;
}

/* Dosya tutamağı IndexedDB'de saklanır (localStorage tutamak saklayamaz) */
const XL = { handle: null, perm: 'none', busy: false };
function idb(mode, op) {
  return new Promise((res, rej) => {
    const rq = indexedDB.open('tigergrow-fs', 1);
    rq.onupgradeneeded = () => rq.result.createObjectStore('h');
    rq.onerror = () => rej(rq.error);
    rq.onsuccess = () => {
      try { const tx = rq.result.transaction('h', mode), q = op(tx.objectStore('h')); tx.oncomplete = () => res(q.result); tx.onerror = () => rej(tx.error); }
      catch (e) { rej(e); }
    };
  });
}

  const r = applyRoster(roster);
  S.settings.excel = { name: f.name, mtime: f.lastModified, at: Date.now(), live: !!XL.handle };
  saveNow();

  if (r.added) parts.push(`+${r.added} öğrenci`);
  if (r.restored) parts.push(`${r.restored} arşivden döndü`);
  if (r.archived) parts.push(`${r.archived} arşive alındı`);
  if (announce || parts.length) toast(`📗 Sınıf listesi güncellendi${parts.length ? ': ' + parts.join(' · ') : ' — değişiklik yok'}`, { ms:6000 });
  if (r.dup.length) toast(`Aynı ad iki kez yazılmış (biri alınmadı): ${r.dup.join(', ')}. Ayırt etmek için soyadının ilk harfini ekleyin.`, { warn:true, ms:9000 });
  if (r.full.length) toast(`Sınıf başına en fazla ${MAX_STUDENTS} öğrenci alınır.`, { warn:true });
}

/* ---- PDF yazıcı: her sayfa tek JPEG görüntü ---- */
async function buildPdf(pages, title) {
  const enc = new TextEncoder(), parts = [], offs = []; let len = 0;
  const push = x => { const b = typeof x === 'string' ? enc.encode(x) : x; parts.push(b); len += b.length; };
  const obj = (n, f) => { offs[n] = len; push(`${n} 0 obj\n`); f(); push('\nendobj\n'); };
  const u16 = str => 'FEFF' + [...String(str)].map(ch => { const c = ch.codePointAt(0); return c > 0xFFFF ? '' : c.toString(16).padStart(4, '0').toUpperCase(); }).join('');
  // sayfa numarası vektör metin olarak eklenir (toplam sayfa sayısı ancak sonda bilinir); Helvetica-Bold genişlikleri
  const wd = t => [...t].reduce((a, ch) => a + ({ S:667, a:556, y:556, f:333, ' ':278, '/':278 }[ch] || 556), 0) * 7.5 / 1000;
  push('%PDF-1.4\n'); push(new Uint8Array([37, 226, 227, 207, 211, 10]));
  const np = pages.length, total = 4 + np * 3, d = new Date();
  obj(1, () => push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2, () => push(`<< /Type /Pages /Kids [${pages.map((_, i) => `${4 + i * 3} 0 R`).join(' ')}] /Count ${np} >>`));
  obj(3, () => push(`<< /Title <${u16(title)}> /Producer (TIGER GROW) /CreationDate (D:${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}${pad2(d.getHours())}${pad2(d.getMinutes())}00) >>`));
  pages.forEach((p, i) => {
    const pn = 4 + i * 3, num = `Sayfa ${i + 1} / ${np}`;
    const cs = `q ${PW} 0 0 ${PH} 0 0 cm /Im0 Do Q BT /F1 7.5 Tf 0.541 0.549 0.502 rg ${(PW - PM - wd(num)).toFixed(2)} 20 Td (${num}) Tj ET`;
    obj(pn, () => push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 ${pn + 2} 0 R >> /Font << /F1 << /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >> >> >> /Contents ${pn + 1} 0 R >>`));
    obj(pn + 1, () => push(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
    obj(pn + 2, () => { push(`<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.jpg.length} >>\nstream\n`); push(p.jpg); push('\nendstream'); });
  });
  const xref = len;
  let x = `xref\n0 ${total}\n0000000000 65535 f \n`;
  for (let n = 1; n < total; n++) x += String(offs[n]).padStart(10, '0') + ' 00000 n \n';
  push(x + `trailer\n<< /Size ${total} /Root 1 0 R /Info 3 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(parts, { type:'application/pdf' });
}
let pdfBusy = false, lastPdf = null;
/* kind: 'class' | 'student' | 'students' | 'all' */
async function makePdf(kind, c, per, sid) {
  if (pdfBusy) return; pdfBusy = true;
  if (panelState.open) $('#panel').classList.add('busy');
  toast('📄 PDF hazırlanıyor…', { ms:2500 });
  try {
    const logo = await loadImg(mascotSrc()), pages = [];
    let name, title;
    if (kind === 'class') { await drawClassReport(c, per, pages, logo); await flushPages(pages); name = `${c.name}-sinif-raporu`; title = `${c.name} Sınıf Raporu`; }
    else if (kind === 'student') { const s = stu(c, sid); await drawStudentReport(c, s, per, pages, logo); await flushPages(pages); name = `${c.name}-${s.name}-ogrenci-raporu`; title = `${s.name} · ${c.name} Öğrenci Raporu`; }
    else if (kind === 'students') { await drawClassReport(c, per, pages, logo); await flushPages(pages); for (const s of sortedStudents(c)) { await drawStudentReport(c, s, per, pages, logo); await flushPages(pages); } name = `${c.name}-tum-ogrenci-raporlari`; title = `${c.name} Öğrenci Raporları`; }
    else { for (const k of S.classes.filter(x => !x.isDemo && x.students.length)) { await drawClassReport(k, per, pages, logo); await flushPages(pages); } name = 'tum-siniflar-raporu'; title = 'Tüm Sınıflar Raporu'; }
    if (!pages.length) return toast('Rapor için sınıf bulunamadı.', { warn:true });
    const blob = await buildPdf(pages, 'TIGER GROW · ' + title);
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `TigerGrow-${slug(name)}-${ymd(new Date())}.pdf`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast(`⬇︎ PDF indirildi · ${pages.length} sayfa`);
    lastPdf = { blob, name: a.download };
  } catch (e) { console.error(e); toast('PDF oluşturulamadı: ' + e.message, { warn:true, ms:7000 }); }
  finally { pdfBusy = false; $('#panel').classList.remove('busy'); }
}

/* =========================================================
   DEMO VERİSİ (10 öğrenci)
   ========================================================= */
function buildDemo() {
  const r = rng(2026);
  const names = ['Ada','Ayşe','Can','Defne','Deniz','Ege','Elif','Kerem','Mehmet','Zeynep'];
  const gen = { Ada:'K', Ayşe:'K', Can:'E', Defne:'K', Deniz:'E', Ege:'E', Elif:'K', Kerem:'E', Mehmet:'E', Zeynep:'K' };
  const targets = { Ada:9, Ayşe:152, Can:47, Defne:88, Deniz:21, Ege:33, Elif:118, Kerem:12, Mehmet:66, Zeynep:96 };
  const now = Date.now(), cw = weekKey();
  const c = Object.assign(blankClass('Demo 5-A'), { weeklyGoal:30, rewards:['flowers','tree'], goalWeeks:[shiftWeek(cw,-2), shiftWeek(cw,-1)], isDemo:true });
  const curShare = { Ada:2, Ayşe:3, Can:2, Defne:3, Deniz:2, Ege:3, Elif:3, Kerem:0, Mehmet:3, Zeynep:2 }; // ≈23/30 bu hafta
  names.forEach((n, i) => {
    const total = targets[n], weeks = {};
    let rest = total - curShare[n];
    const cur = [0,0,0,0]; for (let k = 0; k < curShare[n]; k++) cur[(r()*4)|0]++;
    if (curShare[n]) weeks[cw] = cur;
    const span = n === 'Kerem' ? [-8, -2] : [-8, -1];
    const wl = []; for (let w = span[0]; w <= span[1]; w++) wl.push(shiftWeek(cw, w));
    while (rest > 0) { const wk = wl[(r()*wl.length)|0]; const a = Math.min(rest, 1 + ((r()*3)|0)); (weeks[wk] = weeks[wk] || [0,0,0,0])[(r()*4)|0] += a; rest -= a; }
    const lastFed = n === 'Kerem' ? now - 9 * DAY : now - ((r()*3)|0) * DAY - 3600000;
    c.students.push(Object.assign(newStudent(n, gen[n], i), { xp: total, peak: levelFromXp(total), createdAt: now - 70 * DAY, lastFedAt: lastFed, weeks }));
  });
  const self = {};
  const pw = shiftWeek(cw, -1);
  self[pw] = {}; c.students.forEach(s => self[pw][s.id] = [2 + ((r()*4)|0), 2 + ((r()*4)|0), 2 + ((r()*4)|0)].map(v => Math.min(5, v)));
  self[cw] = {}; c.students.slice(0, 6).forEach(s => self[cw][s.id] = [1 + ((r()*5)|0), 1 + ((r()*5)|0), 1 + ((r()*5)|0)]);
  const ay = c.students.find(s => s.name === 'Ayşe'); if (ay) self[cw][ay.id] = [5, 5, 4];
  const cn = c.students.find(s => s.name === 'Can'); if (cn) { self[cw][cn.id] = [5, 1, 3]; }
  c.self = self;
  c.students.forEach(s => { if (s.weeks[cw]) s.weeks[cw].forEach((v, cat) => { if (v) c.log.push({ id: uid('e'), ts: s.lastFedAt, sids:[s.id], cat, amt: v }); }); });
  c.log.sort((a, b) => b.ts - a.ts);
  return c;
}
function loadDemo() {
  const old = S.classes.find(c => c.isDemo);
  if (old) S.classes = S.classes.filter(c => c !== old);
  const c = buildDemo(); S.classes.push(c);
  saveNow(); switchClass(c.id);
  toast('🎬 Demo 5-A yüklendi — 10 öğrenci');
}

function paceStats(c, per) {
  const id = per || '4w';
  const wks = periodWeeks(c, id);
  const n = c.students.length;
  const total = sum(wks.map(w => classWeekTotal(c, w)));
  const avg = n && wks.length ? total / n / wks.length : 0;
  const eta = food => avg >= 0.05 ? Math.max(1, Math.round(food / avg)) : null;
  const span = food => [Math.max(1, Math.round(food / 5)), Math.max(1, Math.round(food / 4))].sort((a, b) => a - b);
  const band = !n || !wks.length ? 'yok' : avg < 4 ? 'altında' : avg > 5 ? 'üstünde' : 'içinde';
  return {
    per: id, weeks: wks.length, students: n, total, avg, band,
    l3: LEVELS[2].min, l5: LEVELS[4].min,
    eta3: eta(LEVELS[2].min), eta5: eta(LEVELS[4].min),
    assume3: span(LEVELS[2].min), assume5: span(LEVELS[4].min),
    defaults: LEVELS.every((Lv, i) => Lv.min === DEFAULT_LEVEL_MINS[i])
  };
}
function paceCard(c) {
  const st = paceStats(c, panelState.rPer);
  const bandText = st.band === 'altında' ? 'varsayımın altında' : st.band === 'üstünde' ? 'varsayımın üstünde' : st.band === 'içinde' ? 'varsayım aralığında (4–5)' : 'henüz hesaplanamadı';
  const scaleMax = Math.max(8, st.avg, 6);
  const pct = Math.min(100, st.avg / scaleMax * 100);
  const b0 = 4 / scaleMax * 100, b1 = 5 / scaleMax * 100;
  const plan = st.defaults
    ? 'Plan varsayımı haftada 4–5 mamadır. Varsayılan eşiklerle Seviye 3 yaklaşık 9 hafta (4–5 mama ile 8–10), Seviye 5 yaklaşık 30 hafta (28–35).'
    : `Eşikler varsayılandan farklı. Haftada 4–5 mama ile Seviye 3 yaklaşık ${st.assume3[0]}–${st.assume3[1]} hafta, Seviye 5 yaklaşık ${st.assume5[0]}–${st.assume5[1]} hafta.`;
  return `<div class="card"><h3>📈 Tempo — ${esc(c.name)}</h3>

    <div class="pace-nums">
      <div><b>${st.students ? dec(st.avg) : '—'}</b><span>mama / öğrenci / hafta</span></div>
      <div><b>${st.eta3 ?? '—'}</b><span>Sv3 için tahmini hafta</span></div>
      <div><b>${st.eta5 ?? '—'}</b><span>Sv5 için tahmini hafta</span></div>

    <p class="hint">${st.students ? `Seçili dönemde ${st.students} öğrenci, ${st.weeks} hafta, toplam ${st.total} mama. Gerçekleşen tempo ${bandText}.` : 'Bu sınıfta öğrenci yok.'} Eşikler ve günlük sınır Sınıf ve Veri sekmesindedir.</p>
  </div>`;
}

function openDetail(id) {
  const c = cls(), s = stu(c, id); if (!s) return;
  const lv = L(s.peak), nx = LEVELS[s.peak];
  const pct = nx ? Math.min(100, Math.max(0, (s.xp - lv.min) / (nx.min - lv.min) * 100)) : 100;
  const cw = weekKey();
  const wks = []; for (let i = 7; i >= 0; i--) wks.push(shiftWeek(cw, -i));
  const vals = wks.map(w => weekPts(s, w)), mx = Math.max(6, ...vals);
  const bw = 60, gap = 22, ch = 160;
  let chart = `<svg viewBox="0 0 ${wks.length * (bw + gap)} ${ch + 50}" style="width:100%;height:13rem;display:block">`;
  wks.forEach((w, i) => {
    const v = vals[i], h = v / mx * ch, x = i * (bw + gap) + gap / 2;
    chart += `<rect x="${x}" y="${ch - h}" width="${bw}" height="${Math.max(h, 2)}" rx="10" fill="${w === cw ? '#8E4A9E' : '#CFC9AC'}"/>`;
    chart += `<text x="${x + bw / 2}" y="${ch - h - 8}" text-anchor="middle" font-size="18" font-weight="700" fill="#26281d">${v}</text>`;
    chart += `<text x="${x + bw / 2}" y="${ch + 28}" text-anchor="middle" font-size="15" fill="#6d6f62">${parseYmd(w).getDate()} ${AY[parseYmd(w).getMonth()]}</text>`;
  });
  chart += `</svg>`;
  const totals = [0,0,0,0]; Object.values(s.weeks).forEach(a => a.forEach((v, i) => totals[i] += v));
  const selfRows = [0, 1, 2, 3].map(i => shiftWeek(cw, -i)).map(w => {
    const a = c.self[w]?.[s.id]; const tw = s.weeks[w] || [0,0,0,0];
    return `<tr><td>${fmtWeek(w)}</td>${SELF_Q.map((q, k) => `<td><div class="pair"><span class="self">${a ? SCALE[a[k] - 1].e : '—'}</span><span class="tch">+${tw[q.cat]}</span></div></td>`).join('')}</tr>`;
  }).join('');
  const body = `<div class="detail-top"><div class="big">${tigerOf(s)}</div><div style="flex:1">
      <div style="font-size:2.2rem;font-weight:800">${esc(s.name)}</div>
      <div class="lvl-name">${stars(s.peak)} ${lv.name} · toplam ${s.xp} mama ${s.g ? gChip(s.g) : ''}</div>
      <div class="pbar"><i style="width:${pct}%"></i></div>
      <div class="hint">${nx ? `${nx.name} seviyesine ${Math.max(0, nx.min - s.xp)} mama kaldı` : 'En yüksek seviyede 👑'} · Son besleme: ${daysAgo(s.lastFedAt)}</div></div></div>
    <div class="kv">${CATS.map((cat, i) => `<div><b>${totals[i]}</b><span>${cat.e} ${cat.name}</span></div>`).join('')}</div>
    <div class="card" style="margin-top:1rem;background:#fff"><h3>📈 Kendi gelişimi — son 8 hafta</h3>${chart}<p class="hint" style="margin:.4rem 0 0">Karşılaştırma yalnızca öğrencinin kendi geçmişiyle yapılır.</p></div>
    <div class="card" style="background:#fff"><h3>🪞 Öz değerlendirme ve öğretmen puanı</h3><table class="rep"><thead><tr><th>Hafta</th>${SELF_Q.map(q => `<th>${CATS[q.cat].e} ${CATS[q.cat].name}</th>`).join('')}</tr></thead><tbody>${selfRows}</tbody></table></div>`;
  openModal({ title:'Öğrenci ayrıntısı', body, wide:true, actions:[
    ...(c.src === 'excel' ? [] : [{ label:'✏️ Düzenle', onClick: m => { m.close(); renameStudent(id); } }]),
    { label:'🎨 Süsle', onClick: m => { m.close(); openDeco(id); } },
    { label:'📄 PDF rapor', kind:'brand', onClick: () => makePdf('student', c, panelState.rPer, id) },
    { label:'Kapat', kind:'dark' } ] });
}

      <div class="field"><label for="rng">Cinsiyet (kıyafet seçeneklerini belirler)</label><select id="rng" class="input">${[['','Belirtilmemiş'],['K','👧 Kız'],['E','👦 Erkek']].map(([v, l]) => `<option value="${v}" ${s.g === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>`,

async function deleteStudent(id) {
  const c = cls(), s = stu(c, id); if (!s) return;
  if (!(await confirmBox('Öğrenciyi sil', `<b>${esc(s.name)}</b> ve kaplanının tüm geçmişi silinecek. Bu işlem geri alınamaz.`, 'Sil', true))) return;
  c.students = c.students.filter(x => x.id !== id);
  Object.values(c.self).forEach(w => delete w[id]);
  panelState.sel.delete(id);
  syncAutoGoal(c);
  save(); HB.sync(); renderTop(); renderPanel();
}

function nudgeLevel(i, dir) {
  i = +i; dir = +dir;
  if (i < 1 || i > 4 || (dir !== -1 && dir !== 1)) return;
  const mins = LEVELS.map(Lv => Lv.min);
  const lo = mins[i - 1] + 5, hi = i < 4 ? mins[i + 1] - 5 : 9995;
  if (hi < lo) return;
  const next = Math.max(lo, Math.min(hi, mins[i] + dir * 5));
  if (next === mins[i]) return;
  mins[i] = next;
  const lifted = commitLevels(mins);
  if (lifted) toast(`${lifted} kaplan yeni eşiğe ulaştı. Hiçbiri küçülmedi.`);
}
function commitLevels(mins) {
  S.settings.levels = applyLevelMins(mins);
  const lifted = liftPeaks();
  save(); HB.sync(); renderTop();
  if (panelState.open) renderPanel();
  return lifted;
}
async function requestPersist() {
  try {
    if (!navigator.storage?.persist) { BK.persisted = false; return false; }
    BK.persisted = !!(await navigator.storage.persisted());
    if (!BK.persisted) BK.persisted = !!(await navigator.storage.persist());
  } catch (e) { BK.persisted = false; }
  return !!BK.persisted;
}
async function writeNamed(dir, name, text) {
  const fh = await dir.getFileHandle(name, { create:true });
  const w = await fh.createWritable();
  try { await w.write(new Blob([text], { type:'application/json' })); }
  finally { await w.close(); }
}
async function rotateBackups(dir) {
  if (!dir.entries || !dir.removeEntry) return;
  const dated = [];
  for await (const [name] of dir.entries()) if (DATED_RE.test(name)) dated.push(name);
  dated.sort();
  while (dated.length > BK_KEEP) {
    const name = dated.shift();
    try { await dir.removeEntry(name); } catch (e) {}
  }
}
async function readBackupText(dir) {
  const names = [BK_LATEST];
  try {
    const dated = [];
    if (dir.entries) for await (const [name] of dir.entries()) if (DATED_RE.test(name)) dated.push(name);
    dated.sort().reverse();
    names.push(...dated);
  } catch (e) {}
  for (const name of names) {
    try {
      const fh = await dir.getFileHandle(name);
      const file = await fh.getFile();
      const data = normalize(JSON.parse(await file.text()));
      if (data && Array.isArray(data.classes)) return { name, data };
    } catch (e) {}
  }
  return null;
}
async function runBackup(opt = {}) {
  if (BK.writing) { BK.again = true; return false; }
  if (!BK.handle) { if (opt.manual) toast('Önce yedek klasörünü bağlayın.', { warn:true }); return false; }
  if (!worthBackup()) { if (opt.manual) toast('Öğrenci kaydı yok. Eski yedek dosyası korundu.', { warn:true, ms:6000 }); return false; }
  const day = ymd(new Date());
  const hash = stateHash();
  if (opt.auto && hash === BK.hash && S.settings.backup?.day === day) return false;
  BK.writing = true;
  try {
    let p = 'prompt';
    try { p = await BK.handle.queryPermission({ mode:'readwrite' }); } catch (e) { p = 'prompt'; }
    if (p !== 'granted' && opt.manual) {
      try { p = await BK.handle.requestPermission({ mode:'readwrite' }); } catch (e) { p = 'denied'; }
    }
    BK.perm = p === 'granted' ? 'granted' : (p === 'denied' ? 'denied' : 'prompt');
    if (BK.perm !== 'granted') {
      BK.error = 'izin';
      if (opt.manual) toast('Yedek klasörü için izin verilmedi.', { warn:true });
      paintBackup();
      return false;
    }
    const text = JSON.stringify(S, null, 2);
    await writeNamed(BK.handle, BK_LATEST, text);
    await writeNamed(BK.handle, `tigergrow-yedek-${day}.json`, text);
    try { await rotateBackups(BK.handle); } catch (e) {}
    if (stateHash() !== hash) { scheduleBackup(); return true; }
    S.settings.backup = { at: Date.now(), mode:'folder', name: BK.handle.name || S.settings.backup?.name || '', day };
    BK.hash = hash;
    BK.error = '';
    writeLocal();
    paintBackup();
    if (opt.manual) toast('💾 Yedek klasöre yazıldı');
    return true;
  } catch (e) {
    BK.error = 'yazılamadı';
    if (opt.manual) toast('Yedek yazılamadı. Klasörü yeniden bağlayın.', { warn:true, ms:7000 });
    paintBackup();
    return false;
  } finally {
    BK.writing = false;
    if (BK.again) { BK.again = false; scheduleBackup(); }
  }
}
async function linkBackup() {
  if (!window.showDirectoryPicker) {
    toast('Bu tarayıcı klasör bağlamıyor. JSON indirin.', { warn:true, ms:7000 });
    return exportJSON();
  }
  let h;
  try { h = await window.showDirectoryPicker({ id:'tigergrow-backup', mode:'readwrite' }); }
  catch (e) { return; }
  BK.handle = h; BK.perm = 'granted'; BK.error = '';
  try { await idb('readwrite', st => st.put(h, 'backup')); } catch (e) {}
  await requestPersist();
  if (worthBackup()) await runBackup({ manual:true });
  else toast('📂 Yedek klasörü bağlandı. Öğrenci olunca dosya kendiliğinden yazılır.', { ms:6000 });
  if (panelState.open) renderPanel();
}
async function backupNow() {
  if (!BK.handle) return linkBackup();
  return runBackup({ manual:true });
}
function applyRestored(data) {
  S = data;
  saveNow();
  BK.hash = stateHash();
  undoStack.length = 0;
  HB.sync(true); HB.applyEnv(); renderTop(); renderLogo();
  if (panelState.open) renderPanel();
  toast('💾 Yedek geri yüklendi');
}
async function restoreFromFolder(opt = {}) {
  if (!BK.handle) { toast('Bağlı yedek klasörü yok.', { warn:true }); return false; }
  let p = 'prompt';
  try { p = await BK.handle.queryPermission({ mode:'readwrite' }); } catch (e) { p = 'prompt'; }
  if (p !== 'granted') {
    try { p = await BK.handle.requestPermission({ mode:'readwrite' }); } catch (e) { p = 'denied'; }
  }
  BK.perm = p === 'granted' ? 'granted' : 'prompt';
  if (BK.perm !== 'granted') { toast('Yedek klasörü için izin verilmedi.', { warn:true }); return false; }
  const pack = await readBackupText(BK.handle);
  if (!pack) { toast('Klasörde okunabilir yedek yok.', { warn:true, ms:6000 }); return false; }
  if (opt.confirm !== false) {
    const nStu = pack.data.classes.reduce((n, c) => n + c.students.length, 0);
    const names = pack.data.classes.map(c => c.name).join(', ') || '—';
    if (!(await confirmBox('Yedeği geri yükle', `<b>${esc(pack.name)}</b> bu cihazdaki verinin yerine geçecek. ${pack.data.classes.length} sınıf (${esc(names)}), ${nStu} öğrenci.`, 'Geri yükle'))) return false;
  }
  applyRestored(pack.data);
  return true;
}
function storageLost() {
  const raw = localStorage.getItem(LS_KEY);
  if (!raw) return true;
  try { const o = JSON.parse(raw); return !o || !Array.isArray(o.classes); }
  catch { return true; }
}
function offerRestore() {
  return new Promise(resolve => {
    let settled = false;
    const done = () => { if (!settled) { settled = true; resolve(); } };
    openModal({
      title:'Yedek bulundu',
      body:'<p class="hint" style="font-size:1.2rem;margin:0">Bu tarayıcıda sınıf kaydı yok, ancak daha önce bir yedek klasörü bağlanmış. Tahta sıfırlandıysa kaplanlar o klasörden dönebilir.</p>',
      dismissable:true,
      onClose: done,
      actions:[
        { label:'Şimdi değil', onClick: m => m.close() },
        { label:'Yedeği geri yükle', kind:'dark', onClick: async m => {
          const ok = await restoreFromFolder({ confirm:false });
          if (ok) { settled = true; m.close(); resolve(); }
        } }
      ]
    });
  });
}
async function initBackup() {
  try {
    try { BK.handle = (await idb('readonly', st => st.get('backup'))) || null; } catch (e) { BK.handle = null; }
    if (BK.handle) {
      try {
        const p = await BK.handle.queryPermission({ mode:'readwrite' });
        BK.perm = p === 'granted' || p === 'denied' ? p : 'prompt';
      } catch (e) { BK.perm = 'prompt'; }
    }
    await requestPersist();
    if (storageLost() && BK.handle) await offerRestore();
    else if (BK.perm === 'granted' && worthBackup()) runBackup({ auto:true });
  } catch (e) {}
  if (!S.classes.length && !modals.length && !$('#selfView').classList.contains('open')) showWelcome();
}

/* ---------- dışa/içe aktarma, maskot ---------- */
function exportJSON() {
  const b = S.settings.backup || blankBackup();
  S.settings.backup = { at: Date.now(), mode: b.mode === 'folder' ? 'folder' : 'download', name: b.name, day: ymd(new Date()) };
  saveNow();
  const blob = new Blob([JSON.stringify(S, null, 2)], { type:'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `tigergrow-yedek-${ymd(new Date())}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('⬇︎ Yedek indirildi');
  paintBackup();
}
$('#fileImport').addEventListener('change', e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const rd = new FileReader();
  rd.onload = async () => {
    let data; try { data = normalize(JSON.parse(rd.result)); } catch (err) { data = null; }
    if (!data) return toast('Dosya geçerli bir TIGER GROW yedeği değil.', { warn:true });
    if (!(await confirmBox('Yedeği içe aktar', `Dosyada <b>${data.classes.length} sınıf</b> var. Bu cihazdaki mevcut veriler bu yedekle <b>değiştirilecek</b>.`, 'İçe aktar'))) return;
    S = data; saveNow(); undoStack.length = 0; HB.sync(true); HB.applyEnv(); renderTop(); renderLogo();
    while (modals.length) modals[modals.length - 1].close();
    if (panelState.open) renderPanel();
    toast('⬆︎ Yedek yüklendi');
  };
  rd.readAsText(f);
});
$('#fileMascot').addEventListener('change', e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const img = new Image(); const url = URL.createObjectURL(f);
  img.onload = () => {
    const k = Math.min(1, 320 / Math.max(img.width, img.height));
    const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    S.settings.mascot = cv.toDataURL('image/png'); URL.revokeObjectURL(url);
    save(); renderLogo(); if (panelState.open) renderPanel(); toast('🐯 Maskot güncellendi');
  };
  img.onerror = () => toast('Görsel okunamadı.', { warn:true });
  img.src = url;
});

/* =========================================================
   SINIF MENÜSÜ / KARŞILAMA / YENİ SINIF
   ========================================================= */
function classMenu() {
  const body = document.createElement('div');
  body.innerHTML = `<div class="class-list">${S.classes.map(c => `<button class="class-item${c.id === S.activeClassId ? ' on' : ''}" data-cid="${c.id}">${esc(c.name)}<span>${c.students.length} öğrenci</span></button>`).join('')}</div>`;
  const m = openModal({ title:'Sınıf değiştir', body, actions:[
    { label: S.settings.excel ? '🔄 Excel\'den güncelle' : '📗 Excel listesini bağla', onClick: m2 => { m2.close(); XL.handle ? syncExcel({ interactive:true, force:true, announce:true }) : linkExcel(); } },
    { label:'➕ Yeni sınıf', kind:'dark', onClick: m2 => { m2.close(); newClassModal(); } } ] });
  body.addEventListener('click', e => { const b = e.target.closest('[data-cid]'); if (b) { m.close(); switchClass(b.dataset.cid); } });
}
function newClassModal() {
  const m = openModal({ title:'Yeni sınıf', wide:false, body:`
    <div class="field"><label for="ncName">Sınıf adı</label><input id="ncName" class="input" maxlength="30" placeholder="ör. 5-A"></div>
    <div class="field"><label for="ncList">Öğrenci listesi (isteğe bağlı)</label><textarea id="ncList" class="textarea" placeholder="Her satıra bir ad veya takma ad&#10;Excel/CSV sütunu yapıştırabilirsiniz."></textarea></div>
    <label class="check"><input type="checkbox" id="ncFirst" checked> Yalnızca ilk kelimeyi al (soyadları ayıklar)</label>
    <p class="hint">🔒 Yalnızca ad veya takma ad. Soyad ve fotoğraf yok.</p>`,
    actions:[ { label:'Vazgeç' }, { label:'Sınıfı oluştur', kind:'dark', onClick: m2 => {
      const name = $('#ncName').value.trim(); if (!name) return toast('Sınıf adı girin.', { warn:true });
      const names = parseNames($('#ncList').value, $('#ncFirst').checked);
      const c = createClass(name, names); m2.close(); switchClass(c.id);
      toast(`🏫 ${c.name} oluşturuldu${names.length ? ' · ' + c.students.length + ' öğrenci' : ''}`);
    } } ] });
  setTimeout(() => $('#ncName')?.focus(), 50);
}
function showWelcome() {
  const body = document.createElement('div');
  const recover = BK.handle ? `<button data-w="restore">💾 Yedekten geri yükle<small>Bağlı klasördeki son JSON</small></button>` : '';
  body.innerHTML = `<div class="welcome-hero"><div class="tigers wag">${[1,3,5].map((l, i) => tigerSVG(l, i)).join('')}</div>
    <p>Her öğrencinin bir kaplan yavrusu var. Öğrenciler kendi kaplanlarına dokunarak onu besler ve süsler. Ödev, katılım, yardımlaşma ve olumlu davranışlarla beslenen kaplanlar <b>Yavru</b> seviyesinden <b>Efsane Tiger</b> seviyesine büyür. Kaplanlar asla küçülmez.</p></div>
    <div class="bigchoice"><button class="primary" data-w="excel">📗 Excel listesini bağla<small>4A · 5A · 5B sınıfları <b>sinif-listesi.xlsx</b> dosyasından gelir</small></button>
    <button data-w="demo">🎬 Demo sınıfı yükle<small>10 örnek öğrenciyle hemen deneyin</small></button>
    <button data-w="new">➕ Elle sınıf oluştur<small>Ad listesini yapıştırarak başlayın</small></button>${recover}</div>
    <p class="hint" style="text-align:center;margin-top:1rem">🔒 Hesap yok, sunucu yok. Veriler bu tarayıcıda saklanır. Kurulunca öğretmen panelinden yedek klasörünü bağlayın.</p>
    <div class="row" style="justify-content:center"><button class="btn" data-w="import">⬆︎ JSON yedeği içe aktar</button></div>`;
  const m = openModal({ title:'TIGER GROW\'a hoş geldiniz 🐯', body, wide:true, dismissable: S.classes.length > 0 });
  body.addEventListener('click', e => {
    const w = e.target.closest('[data-w]')?.dataset.w; if (!w) return;
    if (w === 'import') { $('#fileImport').click(); return; }
    m.close();
    if (w === 'demo') loadDemo();
    else if (w === 'excel') linkExcel().then(() => { if (!S.classes.length && !modals.length) showWelcome(); });
    else if (w === 'restore') restoreFromFolder().then(() => { if (!S.classes.length && !modals.length) showWelcome(); });
    else newClassModal();
  });
}

/* =========================================================
   ÖZ DEĞERLENDİRME (öğrenci modu)
   ========================================================= */
const SV = { open:false, sid:null, step:0, answers:[] };
function openSelf() {
  const c = cls(); if (!c) return showWelcome();
  if (!c.students.length) return toast('Önce öğrenci ekleyin.', { warn:true });
  SV.open = true; SV.sid = null; renderSelf(); $('#selfView').classList.add('open');
}
function closeSelf() { SV.open = false; $('#selfView').classList.remove('open'); $('#selfView').innerHTML = ''; }
function renderSelf() {
  const c = cls(), wk = weekKey(), data = c.self[wk] || {};
  const v = $('#selfView');
  const head = `<div class="sv-head"><h1>🪞 Haftalık Öz Değerlendirme<small>${esc(c.name)} · ${fmtWeek(wk)}</small></h1>
    ${SV.sid ? '<button class="btn" data-sv="back">← Kaplanlara dön</button>' : ''}<button class="btn dark" data-sv="close">Bitir</button></div>`;
  if (!SV.sid) {
    v.innerHTML = head + `<div class="sv-body"><p class="hint" style="font-size:1.3rem;text-align:center;margin:0 0 1.6rem">Kendi kaplanına dokun ve 3 soruyu yanıtla. Doğru ya da yanlış cevap yok! 🧡</p>
      <div class="sv-grid">${sortedStudents(c).map(s => `<button class="sv-card" data-pick="${s.id}">${data[s.id] ? '<span class="done">✓ Tamam</span>' : ''}<div class="mini">${tigerOf(s)}</div><div class="nm">${esc(s.name)}</div></button>`).join('')}</div></div>`;
    return;
  }
  const s = stu(c, SV.sid);
  if (SV.step >= SELF_Q.length) {
    v.innerHTML = head + `<div class="sv-body"><div class="sv-q"><div class="big wag hopper">${tigerOf(s)}</div>
      <div class="thanks">Teşekkürler ${esc(s.name)}! 🧡</div><p class="hello">Kaplanın seninle gurur duyuyor.</p></div></div>`;
    tone([[784, .15, 0], [988, .15, .1], [1175, .3, .2]]);
    setTimeout(() => { if (SV.open && SV.step >= SELF_Q.length) { SV.sid = null; renderSelf(); } }, 2400);
    return;
  }
  const q = SELF_Q[SV.step];
  v.innerHTML = head + `<div class="sv-body"><div class="sv-q">
    <div class="big wag">${tigerOf(s)}</div><p class="hello">Merhaba ${esc(s.name)}!</p>
    <div class="qnum">SORU ${SV.step + 1} / ${SELF_Q.length}</div><div class="qtext">${CATS[q.cat].e} ${esc(q.t)}</div>
    <div class="scale">${SCALE.map((x, i) => `<button data-ans="${i + 1}"><span class="e">${x.e}</span>${x.l}</button>`).join('')}</div>
    <div class="qdots">${SELF_Q.map((_, i) => `<i class="${i <= SV.step ? 'on' : ''}"></i>`).join('')}</div></div></div>`;
}
$('#selfView').addEventListener('click', e => {
  const sv = e.target.closest('[data-sv]')?.dataset.sv;
  if (sv === 'close') return closeSelf();
  if (sv === 'back') { SV.sid = null; return renderSelf(); }
  const pick = e.target.closest('[data-pick]');
  if (pick) { SV.sid = pick.dataset.pick; SV.step = 0; SV.answers = []; return renderSelf(); }
  const ans = e.target.closest('[data-ans]');
  if (ans) {
    SV.answers.push(Number(ans.dataset.ans)); SV.step++;
    if (SV.step >= SELF_Q.length) {
      const c = cls(), wk = weekKey();
      (c.self[wk] = c.self[wk] || {})[SV.sid] = SV.answers.slice();
      save();
    }
    renderSelf();
  }
});

/* =========================================================
   GENEL OLAYLAR
   ========================================================= */
document.addEventListener('click', e => {
  const act = e.target.closest('#topbar [data-act], #dock [data-act]')?.dataset.act; if (!act) return;
  switch (act) {
    case 'classMenu': S.classes.length ? classMenu() : showWelcome(); break;
    case 'openPanel': openPanel(); break;
    case 'openSelf': openSelf(); break;
    case 'lock':
      if (S.settings.boardFeed) { S.settings.boardFeed = false; save(); renderTop(); toast('🔒 Tahtadan besleme kapatıldı'); }
      else askPin('Beslemeyi açmak için PIN').then(ok => { if (ok) { S.settings.boardFeed = true; save(); renderTop(); toast('🔓 Öğrenciler kaplanlarını besleyebilir'); } });
      if (panelState.open) renderPanel();
      break;
    case 'night': { const c = cls(); if (c) { c.nightOn = !c.nightOn; save(); HB.applyEnv(); } break; }
    case 'fullscreen':
      if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
      else document.exitFullscreen?.();
      break;
  }
});
// Hafta değişimini yakala (tahta günlerce açık kalabilir)
let lastWeek = weekKey();
setInterval(() => {
  const w = weekKey();
  if (w !== lastWeek) { lastWeek = w; renderTop(); if (panelState.open) renderPanel(); }
  if (BK.handle && BK.perm === 'granted' && worthBackup() && S.settings.backup?.day !== ymd(new Date())) runBackup({ auto:true });
}, 60000);

/* =========================================================
   BAŞLAT
   ========================================================= */
buildScene();
HB.init();
HB.sync(true);
HB.applyEnv();
renderTop();
renderLogo();
if (!storageOk) toast('Tarayıcı depolaması kapalı: veriler kaydedilemeyecek. JSON yedeği kullanın.', { warn:true, ms:7000 });
initExcel();
const backupReady = initBackup();

// Test/inceleme için küçük bir kanca
window.TIGERGROW = {
  get state() { return S; }, get lastPdf() { return lastPdf; }, get levels() { return LEVELS.map(Lv => Lv.min); },
  ready: backupReady,
  refresh() { saveNow(); HB.sync(true); HB.applyEnv(); renderTop(); if (panelState.open) renderPanel(); },
  feed, undo, loadDemo, createClass, makePdf, importRosterFile, readXlsx, parseRoster, switchClass, openDeco, openDetail, openPanel, closePanel, renderPanel, panelState, tigerSVG, resolveDeco, DECO,
  normalize, applyLevelMins, liftPeaks, paceStats, stateHash, worthBackup, storageLost, runBackup, readBackupText, restoreFromFolder, idb,
  setLevels(mins) { const lifted = commitLevels(mins); return { levels: LEVELS.map(Lv => Lv.min), lifted }; },
  installBackupHandle(h) { BK.handle = h; BK.perm = 'granted'; BK.error = ''; },
  backup: BK, LS_KEY,
  needsAttention,
  dismiss() { while (modals.length) modals[modals.length - 1].close(); },
  simulateWipe() { S = blankState(); saveNow(); HB.sync(true); HB.applyEnv(); renderTop(); return worthBackup(); }
};
})();
</script>
